<!doctype html>
<html lang="en">
<head>
  <title>Django Cinema</title>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS v5.2.1 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="container mt-3">
    <header>
        <div class="alert alert-primary text-center display-3" role="alert">
        DJANGO CINEMA
        </div>
    </header>
    <main>
        <div class="row justify-content-center align-items-top g-2">
        <div class="col-4">
        <img src="/media/{{ funcion.pelicula.imagen }}" class="img-fluid">
        <p>
        {{ funcion }}
        <br>{{ funcion.fecha }},
        {{ funcion.hora }}
        </p>
        <br>sala: {{ funcion.sala }}
        <br>Precio: {{ funcion.precio }}
        <br>Asientos disponibles: {{ funcion.asientos_disponibles }}
        </div>
        <div class="col">
        <h1 class="display-4">{{ funcion }}</h1>
        <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <a name="id" class="btn btn-danger" href="/" role="button">Cancelar</a>
        <button type="submit" class="btn btn-primary float-end">Comprar</button>
        </form>
        </div>
        </div>
    </main>
        <footer>
        <!-- place footer here-->
        <div class="alert alert-dark my-3 text-center" role="alert">
        Todos los derechos reservados
        </div>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/29fFEXLAyTUJMJBASjFUCZSmKbSSUnQlmh/jp3" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.min.js"
    integrity="sha384-7VPbUDkoPSGFnVtYi0QogXtr74QeVeels99Qfg5VCF+TidwNdjvaKZX19MZ/e6oz" crossorigin="anonymous">
    </script>
    </body>
</html>
